name: SonarCloud (.NET)

on:
  push:
    branches:            
      - sonarqube

  pull_request:
    branche:
      - master
    types: [ opened, synchronize, reopened ] 


permissions:
  contents: read
  pull-requests: write            # permet à SonarCloud d'annoter les PR

jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # historique complet recommandé pour l'analyse (PRs, blame, etc.)   
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
           java-version: 17
           distribution: 'zulu'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarCloud scanner (dotnet-sonarscanner)
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory | Out-Null
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner

      - name: SonarCloud Begin
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ${{ runner.temp }}\scanner\dotnet-sonarscanner begin /k:"dKelvine1548_ProductCatalogue" /o:"dkelvine1548" /d:sonar.cs.opencover.reportsPaths="**/TestResults/coverage/coverage.opencover.xml" /d:sonar.token="${{ env.SONAR_TOKEN }}"

      - name: Build
        shell: powershell
        run: dotnet build --configuration Release

      # === Couverture .NET via Coverlet (format OpenCover) ===
      - name: Test with coverage (OpenCover)
        shell: powershell
        run: |
          dotnet test .\AdvancedDevSample.Test\AdvancedDevSample.Test.csproj --configuration Release /p:CollectCoverage=true /p:CoverletOutput=TestResults/coverage/ /p:CoverletOutputFormat=opencover

      - name: SonarCloud End
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ${{ runner.temp }}\scanner\dotnet-sonarscanner end /d:sonar.token="${{ env.SONAR_TOKEN }}"